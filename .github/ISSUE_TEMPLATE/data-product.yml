name: Declare a data product
description: A new dataset that a team builds and shares through a contract.
title: "[product] "
labels: [governance-request]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team that builds and runs it
      description: An id from governance/teams.yaml
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Product name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What is it for?
    validations:
      required: true
  - type: textarea
    id: columns
    attributes:
      label: Main columns and their sensitivity
      description: One per line, e.g. "email: personal"
  - type: input
    id: inputs
    attributes:
      label: Data products it reads from (contract ids)
  - type: input
    id: consumers
    attributes:
      label: Data products that will read it (if known)
