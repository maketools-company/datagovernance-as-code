name: Change who holds a role
description: A new data owner, steward or sponsor for a domain.
title: "[role] "
labels: [governance-request]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      description: Folder name under domains/, e.g. payments
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [data-owner, data-steward, data-sponsor]
    validations:
      required: true
  - type: input
    id: person
    attributes:
      label: New holder (work email)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Effective from
      placeholder: "2026-12-01"
  - type: checkboxes
    id: agreed
    attributes:
      label: Agreement
      options:
        - label: The new holder has accepted the role.
          required: true
