<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The monorepo: who owns what</title>
  <style>
    .bg{fill:#FBFAF7}
    .ink{fill:#1F2328}.muted{fill:#656D76}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    .card{fill:#FFFFFF;stroke:#E4E2DC}
    .hub{fill:#EEEEFC;stroke:#C9C9F5}.hubc{fill:#4F4FCF}.hubs{stroke:#4F4FCF}
    .cus{fill:#E3F4F1;stroke:#A9DCD3}.cusc{fill:#0B7F72}.cuss{stroke:#0B7F72}
    .sal{fill:#FDEDE3;stroke:#F5C3A3}.salc{fill:#C94F0B}.sals{stroke:#C94F0B}
    .pill{fill:#FFFFFF}
    .frame{fill:none;stroke:#C9C6BE}
    .dot{fill:#FFFFFF}
    @media (prefers-color-scheme: dark){
      .bg{fill:#16181C}
      .ink{fill:#E8E6E1}.muted{fill:#9AA1A9}
      .card{fill:#1F2227;stroke:#33373E}
      .hub{fill:#23234A;stroke:#3C3C7A}.hubc{fill:#A5A5F5}.hubs{stroke:#A5A5F5}
      .cus{fill:#12312D;stroke:#1F5A52}.cusc{fill:#5FD3C2}.cuss{stroke:#5FD3C2}
      .sal{fill:#3A2214;stroke:#6E3B1C}.salc{fill:#F5A06B}.sals{stroke:#F5A06B}
      .pill{fill:#1F2227}
      .frame{fill:none;stroke:#4A4F57}
      .dot{fill:#16181C}
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="cusc"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="772" rx="20"/>

  <text x="48" y="58" class="ink" font-size="22" font-weight="700">The monorepo: who owns what</text>
  <text x="48" y="84" class="muted" font-size="14">Every folder has an owning team. CODEOWNERS, generated by dgac, requires its review on every pull request.</text>

  <!-- ===== Repository frame ===== -->
  <rect x="24" y="116" width="1152" height="592" rx="24" class="frame" stroke-width="1.5"/>
  <g transform="translate(48,103)">
    <rect width="262" height="26" rx="13" class="bg frame" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="3" class="muted"/><circle cx="28" cy="13" r="3" class="muted"/>
    <line x1="19" y1="13" x2="25" y2="13" stroke-width="1.6" class="frame" style="stroke:#656D76"/>
    <text x="40" y="17.5" class="ink" font-size="12.5" font-weight="600">One GitHub repository, three teams</text>
  </g>
  <g transform="translate(0,40)">
  <!-- ===== Hub ===== -->
  <rect x="48" y="112" width="1104" height="140" rx="16" class="hub"/>
  <text x="72" y="146" class="hubc" font-size="12" font-weight="700" letter-spacing="1.5">HUB</text>
  <text x="112" y="146" class="ink mono" font-size="14">governance/</text>
  <g transform="translate(862,126)">
    <rect width="266" height="28" rx="14" class="pill hubs" stroke-width="1"/>
    <circle cx="16" cy="14" r="8" class="hubc"/>
    <text x="32" y="19" class="ink mono" font-size="12.5">@lumen-retail/data-governance</text>
  </g>

  <g font-size="14">
    <g transform="translate(72,172)">
      <rect width="250" height="56" rx="10" class="card"/>
      <circle cx="20" cy="22" r="4" class="hubc"/>
      <text x="34" y="27" class="ink" font-weight="600">Classification</text>
      <text x="34" y="45" class="muted mono" font-size="11.5">classification.yaml</text>
    </g>
    <g transform="translate(338,172)">
      <rect width="250" height="56" rx="10" class="card"/>
      <circle cx="20" cy="22" r="4" class="hubc"/>
      <text x="34" y="27" class="ink" font-weight="600">Glossaries</text>
      <text x="34" y="45" class="muted mono" font-size="11.5">glossary/{domain}.yaml</text>
    </g>
    <g transform="translate(604,172)">
      <rect width="250" height="56" rx="10" class="card"/>
      <circle cx="20" cy="22" r="4" class="hubc"/>
      <text x="34" y="27" class="ink" font-weight="600">Common semantic model</text>
      <text x="34" y="45" class="muted mono" font-size="11.5">semantic/common.ossie.yaml</text>
    </g>
    <g transform="translate(870,172)">
      <rect width="258" height="56" rx="10" class="card"/>
      <circle cx="20" cy="22" r="4" class="hubc"/>
      <text x="34" y="27" class="ink" font-weight="600">dgac tool and schemas</text>
      <text x="34" y="45" class="muted mono" font-size="11.5">requirements.txt, pinned</text>
    </g>
  </g>

  <!-- pinned common model -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="4 5" class="hubs">
    <path d="M729 228 C729 300, 283 268, 283 336"/>
    <path d="M729 228 C729 300, 917 268, 917 336"/>
  </g>
  <g transform="translate(579,272)">
    <rect width="300" height="26" rx="13" class="pill hubs" stroke-width="1"/>
    <text x="150" y="17.5" text-anchor="middle" class="muted" font-size="12">version pinned in each <tspan class="mono">governance.yml</tspan></text>
  </g>

  <!-- ===== Domain: customer ===== -->
  <rect x="48" y="336" width="470" height="312" rx="16" class="cus"/>
  <text x="72" y="370" class="cusc" font-size="12" font-weight="700" letter-spacing="1.5"><tspan class="mono" font-weight="600" letter-spacing="0" font-size="12.5">domains/customer/</tspan></text>
  <text x="72" y="394" class="ink" font-size="19" font-weight="700">customer</text>
  <g transform="translate(242,352)">
    <rect width="252" height="28" rx="14" class="pill cuss" stroke-width="1"/>
    <circle cx="16" cy="14" r="8" class="cusc"/>
    <text x="32" y="19" class="ink mono" font-size="12.5">@lumen-retail/customer-data</text>
  </g>

  <rect x="72" y="414" width="422" height="180" rx="12" class="card"/>
  <text x="92" y="444" class="ink mono" font-size="15" font-weight="600">customer_profile</text>
  <text x="92" y="464" class="muted" font-size="12">data product: ODPS card, ODCS contract, dbt models</text>

  <line x1="116" y1="520" x2="518" y2="520" stroke-width="4" stroke-linecap="round" class="cuss"/>
  <g class="cuss" stroke-width="3">
    <circle cx="116" cy="520" r="7" class="dot"/>
    <circle cx="216" cy="520" r="7" class="dot"/>
    <circle cx="316" cy="520" r="7" class="dot"/>
    <circle cx="430" cy="520" r="11" class="dot"/>
  </g>
  <circle cx="430" cy="520" r="5" class="cusc"/>
  <g font-size="12" text-anchor="middle" class="muted">
    <text x="116" y="550">staging</text>
    <text x="216" y="550">silver</text>
    <text x="316" y="550">gold</text>
    <text x="430" y="552" class="ink" font-weight="600">public</text>
    <text x="430" y="568" class="mono" font-size="11">customers_v1</text>
  </g>

  <text x="72" y="626" class="muted" font-size="12"><tspan class="mono">governance.yml</tspan>: team, target level, common model version</text>

  <!-- ===== Domain: sales ===== -->
  <rect x="682" y="336" width="470" height="312" rx="16" class="sal"/>
  <text x="706" y="370" class="salc" font-size="12" font-weight="700" letter-spacing="1.5"><tspan class="mono" font-weight="600" letter-spacing="0" font-size="12.5">domains/sales/</tspan></text>
  <text x="706" y="394" class="ink" font-size="19" font-weight="700">sales</text>
  <g transform="translate(900,352)">
    <rect width="228" height="28" rx="14" class="pill sals" stroke-width="1"/>
    <circle cx="16" cy="14" r="8" class="salc"/>
    <text x="32" y="19" class="ink mono" font-size="12.5">@lumen-retail/sales-data</text>
  </g>

  <rect x="790" y="414" width="338" height="180" rx="12" class="card"/>
  <text x="810" y="444" class="ink mono" font-size="15" font-weight="600">orders</text>
  <text x="810" y="464" class="muted" font-size="12">data product: ODPS card, ODCS contract, dbt</text>

  <line x1="728" y1="520" x2="1084" y2="520" stroke-width="4" stroke-linecap="round" class="sals"/>
  <g class="sals" stroke-width="3">
    <circle cx="728" cy="520" r="9" class="dot" stroke-dasharray="3 3"/>
    <circle cx="830" cy="520" r="7" class="dot"/>
    <circle cx="914" cy="520" r="7" class="dot"/>
    <circle cx="998" cy="520" r="7" class="dot"/>
    <circle cx="1084" cy="520" r="11" class="dot"/>
  </g>
  <circle cx="1084" cy="520" r="5" class="salc"/>
  <g font-size="12" text-anchor="middle" class="muted">
    <text x="728" y="552" class="mono" font-size="11">external/</text>
    <text x="728" y="567" class="mono" font-size="11">customer</text>
    <text x="830" y="550">staging</text>
    <text x="914" y="550">silver</text>
    <text x="998" y="550">gold</text>
    <text x="1084" y="552" class="ink" font-weight="600">public</text>
    <text x="1084" y="568" class="mono" font-size="11">orders_v1</text>
  </g>

  <text x="706" y="626" class="muted" font-size="12"><tspan class="mono">external/</tspan>: what the domain reads from others</text>

  <!-- ===== Cross-domain reference ===== -->
  <path d="M518 520 L712 520" fill="none" stroke-width="2.5" class="cuss" marker-end="url(#arr)"/>
  <circle cx="518" cy="520" r="6" class="cusc"/>
  <text x="600" y="506" text-anchor="middle" class="ink mono" font-size="12" font-weight="600">ref(…, v=1)</text>
  <text x="600" y="542" text-anchor="middle" class="muted" font-size="12">via dbt-loom</text>

  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(48,740)" font-size="12.5" class="muted">
    <circle cx="8" cy="0" r="6" class="dot cuss" stroke-width="2.5"/>
    <text x="22" y="4.5">dbt layer</text>
    <circle cx="118" cy="0" r="9" class="dot cuss" stroke-width="2.5"/><circle cx="118" cy="0" r="4" class="cusc"/>
    <text x="135" y="4.5">public interface, versioned, under contract</text>
    <circle cx="430" cy="0" r="8" class="dot sals" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text x="446" y="4.5">model from another domain</text>
    <circle cx="640" cy="0" r="7" class="cusc"/>
    <text x="654" y="4.5">team that must approve any change to the block</text>
  </g>
</svg>
