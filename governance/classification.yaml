# Sensitivity levels used by product cards (classification) and contracts (column classification).
# The four levels of the standard. Rename, add or remove levels to match your company's policy.
#   rank   1 is the least sensitive; a product is classified at its most sensitive column
levels:
  - id: public
    rank: 1
    name: Public
    description: May be published outside the company.
  - id: internal
    rank: 2
    name: Internal
    description: Any employee may read it.
  - id: confidential
    rank: 3
    name: Confidential
    description: Business-sensitive. Shared only through a data contract.
  - id: restricted
    rank: 4
    name: Restricted
    description: Strictly limited to named people. Personal data identifying a customer belongs here.
