# Rules everyone follows. Each policy has an owner (a role) and was approved by a committee.

policies:
  - id: personal-data-retention
    title: Personal data is not kept longer than needed
    statement: >
      Personal data is deleted or anonymised 5 years after the customer relationship ends,
      unless a law requires a longer period.
    applies_to: [personal, special-category]
    owner: dpo
    approved_by: data-council
    reference: https://eur-lex.europa.eu/eli/reg/2016/679/oj  # GDPR art. 5(1)(e)

  - id: shared-through-contracts
    title: Confidential data is shared only through data contracts
    statement: >
      Consumers read confidential and personal data through the output port of a data product
      with an active contract, never from raw tables.
    applies_to: [confidential, personal, special-category]
    owner: data-owner
    approved_by: data-council

  - id: human-review-of-automated-decisions
    title: No automated decision about a customer without human review
    statement: >
      Scores and AI outputs about a customer may support a decision, but a person makes it.
    applies_to: [personal]
    owner: dpo
    approved_by: data-council
    reference: https://eur-lex.europa.eu/eli/reg/2016/679/oj  # GDPR art. 22
