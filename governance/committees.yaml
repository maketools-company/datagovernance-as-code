# Decision bodies. `chair` and `members` are role ids: a domain role (e.g. data-owner)
# means every holder of that role.

committees:
  - id: data-council
    name: Data Council
    purpose: Approves policies and settles ownership conflicts between domains.
    chair: cdo
    members: [head-of-data-governance, dpo, data-owner]
    meets: monthly

  - id: stewards-forum
    name: Data Stewards Forum
    purpose: Aligns glossary terms and quality rules across domains.
    chair: head-of-data-governance
    members: [data-steward]
    meets: every two weeks
