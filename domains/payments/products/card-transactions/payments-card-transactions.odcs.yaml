apiVersion: v3.2.0
kind: DataContract
id: payments-card-transactions
name: Card transactions
version: 1.0.0
status: active
domain: payments
team:
  id: cards

description:
  purpose: Analyse card spending and detect fraud.
  limitations: Merchant location is personal data when combined with customer_id.

servers:
  - server: production
    type: snowflake
    environment: prod
    account: novabank-prod
    database: PAYMENTS
    schema: GOLD

schema:
  - name: card_transactions
    physicalName: card_transactions_v1
    physicalType: table
    description: One row per card payment.
    authoritativeDefinitions:
      - type: glossary
        url: domains/payments/glossary.yaml#card-payment
    properties:
      - name: transaction_id
        logicalType: string
        primaryKey: true
        required: true
        classification: internal

      - name: customer_id
        logicalType: string
        required: true
        classification: internal
        authoritativeDefinitions:
          - type: glossary
            url: domains/customer/glossary.yaml#customer

      - name: amount_eur
        logicalType: number
        required: true
        classification: confidential

      - name: merchant_name
        logicalType: string
        classification: internal

      - name: merchant_city
        logicalType: string
        classification: personal

      - name: paid_at
        logicalType: timestamp
        required: true
        classification: internal

slaProperties:
  - property: latency
    value: 1
    unit: h

support:
  - channel: team-cards
    tool: slack
    url: https://novabank.slack.com/archives/team-cards
