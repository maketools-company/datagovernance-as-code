apiVersion: v3.2.0
kind: DataContract
id: payments-deposits
name: Deposits
version: 2.0.0
status: active
domain: payments
team:
  id: wallet

description:
  purpose: Track money coming into customer accounts.
  usage: Amounts are in EUR. Filter on status = 'settled' for accounting figures.

servers:
  - server: production
    type: snowflake
    environment: prod
    account: novabank-prod
    database: PAYMENTS
    schema: GOLD

schema:
  - name: deposits
    physicalName: deposits_v2
    physicalType: table
    description: One row per deposit.
    authoritativeDefinitions:
      - type: glossary
        url: domains/payments/glossary.yaml#deposit
    properties:
      - name: deposit_id
        logicalType: string
        primaryKey: true
        required: true
        classification: internal

      - name: customer_id
        logicalType: string
        required: true
        classification: internal
        authoritativeDefinitions:
          - type: glossary
            url: domains/customer/glossary.yaml#customer

      - name: amount_eur
        logicalType: number
        required: true
        classification: confidential
        quality:
          - type: sql
            description: Deposits are always positive.
            query: SELECT COUNT(*) FROM ${object} WHERE amount_eur <= 0
            mustBe: 0

      - name: channel
        logicalType: string
        classification: internal
        examples: [transfer, cash, cheque]

      - name: status
        logicalType: string
        required: true
        classification: internal
        examples: [pending, settled]

      - name: created_at
        logicalType: timestamp
        required: true
        classification: internal

slaProperties:
  - property: latency
    value: 15
    unit: min

support:
  - channel: team-wallet
    tool: slack
    url: https://novabank.slack.com/archives/team-wallet
