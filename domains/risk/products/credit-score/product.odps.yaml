apiVersion: v1.1.0
kind: DataProduct
id: credit-score
name: Credit score
version: 3.1.0
status: active
domain: risk
type: consumerAligned
team:
  name: risk-analytics

description:
  purpose: Daily credit score for every customer, used by lending and collections.

# What AI agents must know before using this product (ODPS `context` block).
context:
  instructions: Use credit_score to rank or prioritise customers for human review.
  constraints:
    - constraint: Never refuse credit or close an account based on credit_score alone (policy human-review-of-automated-decisions).

# Products this one reads from. Each contractId must exist in this repository.
inputPorts:
  - name: customers
    version: 1.2.0
    contractId: customer-profiles
  - name: deposits
    version: 2.0.0
    contractId: payments-deposits
  - name: card-transactions
    version: 1.0.0
    contractId: payments-card-transactions

outputPorts:
  - name: credit-scores
    version: 3.1.0
    contractId: risk-credit-scores
