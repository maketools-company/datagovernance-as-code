# Business terms owned by the Credit Risk domain.

terms:
  - id: credit-score
    name: Credit score
    definition: >
      Probability, from 0 to 1, that a customer misses a repayment within 12 months.
      Higher means riskier.
    synonyms: [risk score, PD]
    status: approved
    related: [customer/customer]

  - id: default
    name: Default
    definition: A customer who is more than 90 days late on a repayment.
    status: approved

  - id: exposure
    name: Exposure
    definition: Total amount the bank could lose if a customer defaults today.
    synonyms: [EAD]
    status: draft
