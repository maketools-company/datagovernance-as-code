# Generated by `python tools/dgac.py generate`. Do not edit by hand.
# dbt semantic configuration of orders, from the common model and orders.ossie.yaml.
# Private metrics are included: the domain computes them; they are left out of the published model.
semantic_models:
- name: orders
  description: Valid orders, from the Sales domain.
  model: ref('orders', v=1)
  defaults:
    agg_time_dimension: ordered_on
  entities:
  - name: orders
    type: primary
    expr: order_id
  - name: customers
    type: foreign
    expr: customer_id
  dimensions:
  - name: ordered_on
    type: time
    type_params:
      time_granularity: day
  - name: status
    type: categorical
  measures:
  - name: revenue
    agg: sum
    expr: amount
  - name: order_count
    agg: count
    expr: order_id
  - name: average_basket
    agg: average
    expr: amount
- name: customers
  description: Customers, from the Customer domain.
  model: ref('customer__customers')
  entities:
  - name: customers
    type: primary
    expr: customer_id
  dimensions:
  - name: country
    type: categorical
  - name: signed_up_on
    type: time
    type_params:
      time_granularity: day
- name: order_margins
  description: Margin per order. For the Sales domain only.
  model: ref('gld_orders')
  defaults:
    agg_time_dimension: ordered_on
  entities:
  - name: order_margins
    type: primary
    expr: order_id
  dimensions:
  - name: ordered_on
    type: time
    type_params:
      time_granularity: day
  measures:
  - name: gross_margin
    agg: sum
    expr: margin
metrics:
- name: revenue
  label: revenue
  description: Amount paid by customers, in euros, taxes included, returns not deducted.
  type: simple
  type_params:
    measure: revenue
- name: order_count
  label: order_count
  description: Number of valid orders.
  type: simple
  type_params:
    measure: order_count
- name: revenue_france
  label: revenue_france
  description: Revenue from customers living in France.
  type: simple
  type_params:
    measure: revenue
  filter: '{{ Dimension(''customers__country'') }} = ''France'''
- name: average_basket
  label: average_basket
  description: Average amount of a valid order, in euros.
  type: simple
  type_params:
    measure: average_basket
- name: gross_margin
  label: gross_margin
  description: Revenue minus purchase cost. For the Sales domain only.
  type: simple
  type_params:
    measure: gross_margin
