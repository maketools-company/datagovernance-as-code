# Data product, Open Data Product Standard (ODPS) v1.1.0: https://bitol-io.github.io/open-data-product-standard/
apiVersion: v1.1.0
kind: DataProduct
id: customer-profile
name: Customer profile
version: 1.2.0
status: active
domain: customer           # must match the folder: domains/customer/
type: sourceAligned
team:
  name: onboarding         # a team id from governance/teams.yaml

description:
  purpose: One row per customer, with identity, contact details and KYC status.
  limitations: Prospects are not included.

outputPorts:
  - name: customers
    version: 1.2.0
    contractId: customer-profiles   # the contract in this folder
